<!DOCTYPE html>
<!-- «Медиаплеер» / MediaPlayer - плеер одной страницей, без сети.
     Свой альбом из 12 мелодий: каждая задана нотами в коде (генератор песни: темп, лад,
     аккорды, мелодия, барабаны) и синтезируется прямо здесь через Web Audio API. Свои файлы
     (mp3, ogg, wav, flac, mp4, webm) - кнопкой или перетаскиванием, никуда не загружаются.
     Плейлист, перемешивание, повтор, перемотка, скорость, 10-полосный эквалайзер с
     пресетами, визуализация (спектр, волна, круг), мини-режим, горячие клавиши, Media Session,
     память настроек и позиции (localStorage). Пять тем Paint, интерфейс RU/EN.
     Законы страницы - tests/web/media-player.spec.js, проверка законов мутациями -
     tests/web/media-player-mutate.js. Оболочка Electron - папка electron/ рядом. -->
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="application-name" content="Медиаплеер">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Медиаплеер: свой альбом из 12 синтезированных мелодий и ваши файлы; эквалайзер, визуализация, мини-режим. Работает без интернета.">
<meta name="color-scheme" content="dark light">
<title>Медиаплеер / MediaPlayer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%235b8def'/%3E%3Cstop offset='1' stop-color='%239d5bef'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='4' y='4' width='56' height='56' rx='16' fill='url(%23g)'/%3E%3Cpath d='M26 18v22.5a7 7 0 1 0 4 6.3V27l14-3.5v12a7 7 0 1 0 4 6.3V13z' fill='%23fff'/%3E%3C/svg%3E">
<style>
/* Темы - те же пять, что в Paint Pro и калькуляторах («Стеклянная», «Строгая», «Светлая»,
   «Ночная», «Тёплая»), с теми же значениями токенов (источник - Calculators/calcpro-glass/
   src/themes.css). Смена темы - атрибут data-theme на <html>, у «Стеклянной» его нет. */
:root {
  --glass-bg: rgba(255, 255, 255, 0.08);
  --glass-bg-strong: rgba(255, 255, 255, 0.14);
  --glass-bg-soft: rgba(255, 255, 255, 0.05);
  --glass-border: rgba(255, 255, 255, 0.18);
  --glass-border-strong: rgba(255, 255, 255, 0.32);
  --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
  --blur: blur(28px) saturate(190%);
  --glass-sat: 190%;
  --text: #f4f4f8;
  --text-dim: rgba(244, 244, 248, 0.62);
  --accent: #5b8def;
  --accent-2: #9d5bef;
  --accent-grad: linear-gradient(135deg, #5b8def 0%, #9d5bef 100%);
  --danger: #ff5b5b;
  --success: #2dd4a8;
  --app-base: #12101f;
  --app-bg:
    radial-gradient(80% 60% at 12% -10%, rgba(120, 90, 255, 0.55), transparent 60%),
    radial-gradient(65% 50% at 95% 8%, rgba(255, 100, 180, 0.40), transparent 55%),
    radial-gradient(60% 70% at 85% 110%, rgba(60, 200, 255, 0.40), transparent 60%),
    radial-gradient(50% 50% at 5% 105%, rgba(100, 255, 180, 0.30), transparent 60%),
    linear-gradient(135deg, #0e0c1a 0%, #1a1330 50%, #0c1024 100%);
  --ink: 255 255 255;
  --accent-rgb: 91 141 239;
  --on-accent: #ffffff;
}
:root[data-theme="formal"] {
  --glass-bg: rgba(255, 255, 255, 0.055);
  --glass-bg-strong: rgba(255, 255, 255, 0.10);
  --glass-bg-soft: rgba(255, 255, 255, 0.035);
  --glass-border: rgba(255, 255, 255, 0.11);
  --glass-border-strong: rgba(255, 255, 255, 0.20);
  --glass-shadow: 0 6px 20px rgba(0, 0, 0, 0.32);
  --blur: blur(20px) saturate(120%);
  --glass-sat: 120%;
  --text: #e6e8ec;
  --text-dim: rgba(230, 232, 236, 0.55);
  --accent: #4a7ab8;
  --accent-2: #5c7fa6;
  --accent-grad: linear-gradient(135deg, #4a7ab8 0%, #5c7fa6 100%);
  --app-base: #1f242e;
  --app-bg: linear-gradient(160deg, #1b1f27 0%, #232833 55%, #191d25 100%);
  --ink: 255 255 255;
  --accent-rgb: 74 122 184;
}
:root[data-theme="light"] {
  --glass-bg: rgba(22, 26, 38, 0.045);
  --glass-bg-strong: rgba(22, 26, 38, 0.10);
  --glass-bg-soft: rgba(22, 26, 38, 0.03);
  --glass-border: rgba(22, 26, 38, 0.14);
  --glass-border-strong: rgba(22, 26, 38, 0.26);
  --glass-shadow: 0 6px 20px rgba(30, 40, 70, 0.14);
  --blur: blur(18px) saturate(130%);
  --glass-sat: 130%;
  --text: #1b2030;
  --text-dim: rgba(27, 32, 48, 0.62);
  --accent: #3a6fd8;
  --accent-2: #7a52d0;
  --accent-grad: linear-gradient(135deg, #3a6fd8 0%, #7a52d0 100%);
  --danger: #d93636;
  --success: #138a6c;
  --app-base: #e8ecf3;
  --app-bg: linear-gradient(160deg, #eff2f7 0%, #e3e8f0 55%, #dde3ed 100%);
  --ink: 22 26 38;
  --accent-rgb: 58 111 216;
}
:root[data-theme="night"] {
  --glass-bg: rgba(255, 255, 255, 0.045);
  --glass-bg-strong: rgba(255, 255, 255, 0.085);
  --glass-bg-soft: rgba(255, 255, 255, 0.03);
  --glass-border: rgba(255, 255, 255, 0.09);
  --glass-border-strong: rgba(255, 255, 255, 0.17);
  --glass-shadow: 0 6px 22px rgba(0, 0, 0, 0.55);
  --blur: blur(18px) saturate(110%);
  --glass-sat: 110%;
  --text: #dcdde3;
  --text-dim: rgba(220, 221, 227, 0.52);
  --accent: #4668a8;
  --accent-2: #6a5aa0;
  --accent-grad: linear-gradient(135deg, #4668a8 0%, #6a5aa0 100%);
  --app-base: #08090e;
  --app-bg: linear-gradient(160deg, #06070b 0%, #0b0d13 55%, #05060a 100%);
  --ink: 255 255 255;
  --accent-rgb: 70 104 168;
}
:root[data-theme="warm"] {
  --glass-bg: rgba(255, 236, 210, 0.07);
  --glass-bg-strong: rgba(255, 236, 210, 0.13);
  --glass-bg-soft: rgba(255, 236, 210, 0.045);
  --glass-border: rgba(255, 226, 190, 0.16);
  --glass-border-strong: rgba(255, 226, 190, 0.28);
  --glass-shadow: 0 8px 26px rgba(30, 16, 6, 0.45);
  --blur: blur(22px) saturate(150%);
  --glass-sat: 150%;
  --text: #f5ead9;
  --text-dim: rgba(245, 234, 217, 0.60);
  --accent: #d08a3c;
  --accent-2: #b4562f;
  --accent-grad: linear-gradient(135deg, #d08a3c 0%, #b4562f 100%);
  --app-base: #1d1610;
  --app-bg:
    radial-gradient(65% 55% at 10% -8%, rgba(190, 110, 40, 0.35), transparent 60%),
    radial-gradient(58% 50% at 96% 10%, rgba(150, 60, 40, 0.28), transparent 58%),
    linear-gradient(150deg, #17110b 0%, #241a10 55%, #140f0a 100%);
  --ink: 255 236 210;
  --accent-rgb: 208 138 60;
}

* { box-sizing: border-box; }
html { background: var(--app-base); }
body {
  margin: 0; min-height: 100vh; color: var(--text); background: transparent;
  font: 15px/1.4 "Segoe UI", system-ui, -apple-system, Roboto, "Noto Sans", sans-serif;
}
body::before { content: ''; position: fixed; inset: 0; background: var(--app-bg); z-index: -1; pointer-events: none; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.app { max-width: 1180px; margin: 0 auto; padding: 14px 16px 22px; display: flex; flex-direction: column; gap: 14px; min-height: 100vh; }
/* Стекло панелей без backdrop-filter (перенос исправления WritingSpeed 1.1.1: там при наведении на
   кнопку меню светлела нижняя половина панели). backdrop-filter заново читает то, что под панелью, и на
   видеокарте при перерисовке одной кнопки Chromium пересчитывал размытие только в полосе панели,
   захватывая уже нарисованную панель, - полоса светлела. Под панелями всегда один и тот же неподвижный
   фон темы, размывать там нечего: его копия с background-attachment: fixed и обычным filter: saturate
   даёт тот же вид без чтения подложки. Рамка - на ::after (псевдоэлементы с z-index -1 внутри isolation
   рисуются поверх рамки самого элемента). Всплывающие панели (.panel) непрозрачные - им подложка не нужна. */
.glass {
  background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 18px;
  box-shadow: var(--glass-shadow); position: relative; isolation: isolate;
}
.glass::before, .glass::after { content: ''; position: absolute; inset: -1px; border-radius: inherit; z-index: -1; pointer-events: none; }
.glass::before { background: var(--app-bg); background-color: var(--app-base); background-attachment: fixed; filter: saturate(var(--glass-sat)); }
.glass::after { background: var(--glass-bg); border: 1px solid var(--glass-border); }
.panel.glass::before, .panel.glass::after { content: none; }
header.top { display: flex; align-items: center; gap: 8px; padding: 10px 14px; flex-wrap: wrap; position: relative; z-index: 20; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; min-width: 0; }
.brand svg { width: 34px; height: 34px; flex: none; }
.brand h1 { font-size: 19px; margin: 0; letter-spacing: .2px; }
.brand small { display: block; color: var(--text-dim); font-size: 12px; }
.btn {
  border: 1px solid var(--glass-border); background: var(--glass-bg-soft); border-radius: 11px;
  padding: 6px 12px; min-height: 34px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  transition: background .15s, border-color .15s;
}
.btn:hover { background: var(--glass-bg-strong); border-color: var(--glass-border-strong); }
.btn[aria-pressed="true"], .btn.on { background: var(--accent-grad); border-color: transparent; color: var(--on-accent); }
.btn svg { width: 18px; height: 18px; fill: currentColor; flex: none; }
.icon-btn { width: 36px; padding: 0; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; grid-template-areas: "player list" "eq list"; gap: 14px; align-items: start; }
.player { grid-area: player; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.side { grid-area: list; padding: 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0; max-height: calc(100vh - 110px); position: sticky; top: 14px; }
.eq { grid-area: eq; padding: 12px 14px 14px; min-width: 0; }
.stage { position: relative; height: 300px; border-radius: 14px; overflow: hidden; background: rgb(var(--ink) / 0.04); border: 1px solid var(--glass-border); }
.stage canvas, .stage video { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.stage video { background: #000; object-fit: contain; }
.viz-modes { position: absolute; right: 8px; top: 8px; display: flex; gap: 4px; z-index: 2; }
.viz-modes .btn { min-height: 28px; padding: 3px 9px; font-size: 13px; background: rgb(0 0 0 / 0.18); }
:root[data-theme="light"] .viz-modes .btn:not([aria-pressed="true"]) { background: rgb(255 255 255 / 0.55); }
.now { display: flex; align-items: center; gap: 12px; min-width: 0; }
.now img { width: 64px; height: 64px; border-radius: 12px; flex: none; box-shadow: 0 4px 14px rgb(0 0 0 / 0.3); }
.now .meta { min-width: 0; }
#now-title { font-size: 19px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#now-sub { color: var(--text-dim); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.progress { display: flex; align-items: center; gap: 10px; font-variant-numeric: tabular-nums; font-size: 13px; color: var(--text-dim); }
.progress input { flex: 1; min-width: 0; }
input[type=range] { accent-color: var(--accent); height: 22px; cursor: pointer; margin: 0; }
.controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.transport { display: flex; align-items: center; gap: 6px; }
.transport .btn { width: 40px; height: 40px; padding: 0; border-radius: 50%; }
.transport #play { width: 54px; height: 54px; background: var(--accent-grad); color: var(--on-accent); border-color: transparent; }
.transport #play svg { width: 26px; height: 26px; }
#repeat[data-mode="one"]::after { content: '1'; font-size: 10px; font-weight: 700; margin-left: -4px; margin-top: 10px; }
.vol { display: flex; align-items: center; gap: 6px; margin-left: auto; }
.vol input { width: 110px; }
.sel { display: inline-flex; align-items: center; gap: 6px; color: var(--text-dim); font-size: 13px; }
select { background: var(--glass-bg-soft); border: 1px solid var(--glass-border); border-radius: 9px; padding: 5px 8px; min-height: 32px; }
select option { background: var(--app-base); color: var(--text); }
.pl-head { display: flex; align-items: center; gap: 8px; }
.pl-head h2, .eq-head h2 { font-size: 16px; margin: 0; }
.pl-head .count { color: var(--text-dim); font-size: 13px; margin-right: auto; }
.pl-head .btn { min-height: 28px; padding: 3px 9px; font-size: 13px; }
#playlist { list-style: none; margin: 0; padding: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; min-height: 120px; }
/* Полоса прокрутки поверх содержимого (overlay: Chrome в Windows 11, macOS) места не занимает и рисуется над
   правым краем строк - без отступа она закрывала кнопку «играть» строки на 7 px. Класс ставит замер ниже. */
:root.overlay-sb #playlist { padding-right: 14px; }
#playlist .group { color: var(--text-dim); font-size: 12px; text-transform: uppercase; letter-spacing: .6px; padding: 8px 6px 2px; }
.item { display: flex; align-items: center; gap: 9px; padding: 5px 6px; border-radius: 10px; cursor: default; border: 1px solid transparent; user-select: none; }
.item:hover { background: var(--glass-bg-soft); }
.item.current { background: var(--glass-bg-strong); border-color: var(--glass-border); }
/* рамка фокуса строки внутри строки: снаружи её срезал край прокручиваемого списка (слева, у первой строки сверху) */
.item:focus-visible { outline-offset: -2px; }
.item.current .title { color: var(--accent); font-weight: 600; }
:root[data-theme="light"] .item.current .title { color: var(--accent); }
.item.drop-before { box-shadow: inset 0 2px 0 var(--accent); }
.item.drop-after { box-shadow: inset 0 -2px 0 var(--accent); }
.item.dragging { opacity: .4; }
.item.broken .title { text-decoration: line-through; opacity: .6; }
.item img { width: 36px; height: 36px; border-radius: 8px; flex: none; }
.item .meta { flex: 1; min-width: 0; }
.item .title { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .sub { display: block; color: var(--text-dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .dur { color: var(--text-dim); font-size: 12px; font-variant-numeric: tabular-nums; }
.item .go, .item .rm { width: 28px; height: 28px; min-height: 28px; padding: 0; border-radius: 8px; flex: none; }
.item .go svg, .item .rm svg { width: 14px; height: 14px; }
.drop-hint { color: var(--text-dim); font-size: 12px; text-align: center; padding: 8px; border: 1px dashed var(--glass-border-strong); border-radius: 10px; }
.eq-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
.eq-head .note { color: var(--text-dim); font-size: 12px; margin-left: auto; }
.eq-bands { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px; }
.eq-band { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
.eq-band input { writing-mode: vertical-lr; direction: rtl; width: 22px; height: 120px; }
.eq-band b { font-weight: 600; color: var(--text); font-size: 11px; }
footer { color: var(--text-dim); font-size: 12px; text-align: center; }
#toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); max-width: min(92vw, 560px); padding: 10px 16px; border-radius: 12px; background: var(--app-base); color: var(--text); border: 1px solid var(--glass-border-strong); box-shadow: var(--glass-shadow); font-size: 14px; z-index: 50; opacity: 0; pointer-events: none; transition: opacity .2s; }
#toast.show { opacity: 1; }
.panel { position: absolute; right: 12px; top: calc(100% + 6px); z-index: 30; width: min(360px, calc(100vw - 32px)); padding: 14px; background: var(--app-base); }
.panel h3 { margin: 0 0 8px; font-size: 15px; }
.panel .row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.swatch { border: 2px solid transparent; border-radius: 10px; padding: 8px 10px; color: #fff; text-shadow: 0 1px 2px rgb(0 0 0 / .5); min-width: 92px; }
.swatch[aria-pressed="true"] { border-color: var(--accent); }
.panel table { width: 100%; border-collapse: collapse; font-size: 13px; }
.panel td { padding: 3px 4px; border-bottom: 1px solid var(--glass-border); }
kbd { font: 12px/1 Consolas, monospace; padding: 2px 5px; border-radius: 5px; border: 1px solid var(--glass-border-strong); background: var(--glass-bg-soft); }
#drop-overlay { position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; font-size: 22px; background: rgb(var(--accent-rgb) / 0.25); border: 3px dashed var(--accent); pointer-events: none; }
/* Мини-режим: одна полоса - обложка, название, кнопки, перемотка */
body.mini .layout { grid-template-columns: minmax(0, 1fr); grid-template-areas: "player"; }
body.mini .side, body.mini .eq, body.mini .stage, body.mini .brand small, body.mini #open-files span { display: none !important; }
body.mini .app { max-width: 720px; padding-top: 8px; gap: 8px; }
body.mini .player { padding: 10px 12px; gap: 8px; }
body.mini .now img { width: 44px; height: 44px; }
body.mini #now-title { font-size: 16px; }
body.mini .transport #play { width: 46px; height: 46px; }
@media (max-width: 900px) {
  .layout { grid-template-columns: minmax(0, 1fr); grid-template-areas: "player" "list" "eq"; }
  .side { position: relative; top: auto; max-height: none; }
  #playlist { max-height: 420px; }
}
@media (max-width: 560px) {
  .app { padding: 10px 10px 18px; gap: 10px; }
  .brand small, #open-files span { display: none; }
  .stage { height: 190px; }
  .vol { margin-left: 0; }
  .vol input { width: 90px; }
  .eq-band input { height: 100px; width: 18px; }
  .eq-band span { font-size: 9px; }
  .now img { width: 52px; height: 52px; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top glass">
    <div class="brand">
      <svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="bg-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--accent)"/><stop offset="1" stop-color="var(--accent-2)"/></linearGradient></defs><rect x="4" y="4" width="56" height="56" rx="16" fill="url(#bg-g)"/><path d="M26 18v22.5a7 7 0 1 0 4 6.3V27l14-3.5v12a7 7 0 1 0 4 6.3V13z" fill="#fff"/></svg>
      <div><h1 data-i18n="title">Медиаплеер</h1><small data-i18n="subtitle">Своя музыка и ваши файлы, без интернета</small></div>
    </div>
    <button class="btn" id="open-files" data-i18n-title="open" title="Открыть файлы"><svg viewBox="0 0 24 24"><path d="M10 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-8z"/></svg><span data-i18n="open">Открыть файлы</span></button>
    <input type="file" id="file-input" multiple accept="audio/*,video/*,.mp3,.ogg,.oga,.opus,.wav,.flac,.m4a,.aac,.mp4,.m4v,.webm" hidden>
    <button class="btn icon-btn" id="mini" aria-pressed="false" data-i18n-title="mini" title="Мини-режим"><svg viewBox="0 0 24 24"><path d="M3 5h18v14H3zm2 2v10h14V7zm6 5h7v4h-7z"/></svg></button>

    $('#shuffle').addEventListener('click', () => player.setShuffle(!settings.shuffle));
    $('#repeat').addEventListener('click', () => player.setRepeat(REPEATS[(REPEATS.indexOf(settings.repeat) + 1) % 3]));
    $('#mute').addEventListener('click', () => player.setMuted(!settings.muted));
    $('#volume').addEventListener('input', (e) => player.setVolume(Number(e.target.value)));
    $('#speed').addEventListener('change', (e) => player.setRate(Number(e.target.value)));
    const seek = $('#seek');
    seek.addEventListener('pointerdown', () => { seeking = true; });
    const endSeek = () => { seeking = false; };
    seek.addEventListener('pointerup', endSeek); seek.addEventListener('pointercancel', endSeek); seek.addEventListener('blur', endSeek);
    seek.addEventListener('input', () => { const d = player.state().duration; player.seek(Number(seek.value) / 1000 * d); });
    seek.addEventListener('change', () => { seeking = false; });
    $('#mini').addEventListener('click', () => { settings.mini = !settings.mini; saveSettings(); update(); });
    $('#ui-lang').addEventListener('click', () => { settings.ui = settings.ui === 'ru' ? 'en' : 'ru'; saveSettings(); applyLook(); });
    $('#open-files').addEventListener('click', () => $('#file-input').click());
    $('#file-input').addEventListener('change', (e) => { player.addFiles([...e.target.files]); e.target.value = ''; });
    $('#clear-files').addEventListener('click', () => player.clearFiles());
    $('#eq-preset').addEventListener('change', (e) => player.setPreset(e.target.value));
    $('#eq-bands').addEventListener('input', (e) => {
      const i = Number(e.target.dataset.band);
      if (!(i >= 0)) return;
      const gains = [...settings.eq.gains]; gains[i] = Number(e.target.value);
      player.setEq(gains, 'custom');
    });
    for (const b of document.querySelectorAll('[data-viz]')) b.addEventListener('click', () => { settings.viz = b.dataset.viz; saveSettings(); update(); });
    const panels = { 'open-settings': '#settings', 'open-help': '#help' };
    for (const [id, sel] of Object.entries(panels)) $('#' + id).addEventListener('click', (e) => { e.stopPropagation(); const p = $(sel); const show = p.hidden; for (const s of Object.values(panels)) $(s).hidden = true; p.hidden = !show; });
    document.addEventListener('click', (e) => { for (const s of ['#settings', '#help']) if (!$(s).hidden && !$(s).contains(e.target)) $(s).hidden = true; });
    $('#settings').addEventListener('click', (e) => {
      e.stopPropagation(); // кнопки панели перерисовываются - документ не должен принять щелчок за «мимо панели»
      const t = e.target.closest('[data-theme-id]');
      if (t) { settings.theme = t.dataset.themeId; saveSettings(); applyLook(); $('#settings').hidden = false; return; }
      const u = e.target.closest('[data-ui]');
      if (u) { settings.ui = u.dataset.ui; saveSettings(); applyLook(); $('#settings').hidden = false; }
    });
    // плейлист: двойной щелчок или Enter - играть, кнопки в строке, перетаскивание строк
    const ol = $('#playlist');
    const rowOf = (el) => el && el.closest('.item');
    ol.addEventListener('dblclick', (e) => { const r = rowOf(e.target); if (r && !e.target.closest('button')) player.play(Number(r.dataset.i)); });
    ol.addEventListener('click', (e) => {
      const b = e.target.closest('button[data-act]'), r = rowOf(e.target);
      if (!r) return;
      const i = Number(r.dataset.i);
      if (b && b.dataset.act === 'go') player.play(i);
      else if (b && b.dataset.act === 'rm') player.remove(i);
      else r.focus();
    });
    ol.addEventListener('dragstart', (e) => { const r = rowOf(e.target); if (!r) return; dragFrom = Number(r.dataset.i); r.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/x-mp-row', String(dragFrom)); });
    const clearMarks = () => ol.querySelectorAll('.drop-before, .drop-after, .dragging').forEach((x) => x.classList.remove('drop-before', 'drop-after', 'dragging'));
    ol.addEventListener('dragend', () => { dragFrom = -1; clearMarks(); });
    const where = (e, r) => { const b = r.getBoundingClientRect(); return e.clientY < b.top + b.height / 2 ? 'before' : 'after'; };
    ol.addEventListener('dragover', (e) => {
      if (dragFrom < 0) return;
      const r = rowOf(e.target);
      e.preventDefault(); e.stopPropagation();
      ol.querySelectorAll('.drop-before, .drop-after').forEach((x) => x.classList.remove('drop-before', 'drop-after'));
      if (r) r.classList.add('drop-' + where(e, r));
    });
    ol.addEventListener('drop', (e) => {
      if (dragFrom < 0) return;
      e.preventDefault(); e.stopPropagation();
      const r = rowOf(e.target);
      const from = dragFrom; dragFrom = -1; clearMarks();
      if (!r) return;
      let to = Number(r.dataset.i) + (where(e, r) === 'after' ? 1 : 0);
      if (to > from) to--;
      player.move(from, clamp(to, 0, player.list().length - 1));
    });
    // файлы, брошенные на окно
    const ov = $('#drop-overlay');
    const hasFiles = (e) => e.dataTransfer && [...(e.dataTransfer.types || [])].includes('Files');
    document.addEventListener('dragover', (e) => { if (dragFrom >= 0 || !hasFiles(e)) return; e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; ov.hidden = false; });
    document.addEventListener('dragleave', (e) => { if (!e.relatedTarget) ov.hidden = true; });
    document.addEventListener('drop', (e) => {
      if (dragFrom >= 0) return;
      e.preventDefault(); ov.hidden = true;
      const files = e.dataTransfer ? [...e.dataTransfer.files] : [];
      if (files.length) player.addFiles(files);
    });
    // элемент файла
    const m = $('#media');
    m.addEventListener('ended', () => { const it = player.current(); if (it && it.kind === 'file') player.onEnded(); });
    m.addEventListener('error', () => { if (m.getAttribute('src')) player.onMediaError(); });
    m.addEventListener('loadedmetadata', () => {
      const src = player.source();
      if (src && src.pendingSeek != null) { m.currentTime = Math.min(src.pendingSeek, m.duration || src.pendingSeek); src.pendingSeek = null; }
      const it = player.current();
      if (it && it.kind === 'file') { if (isFinite(m.duration)) it.duration = m.duration; if (it.video && !(m.videoWidth > 0)) { it.video = false; track(it); } }
      update(); Session.position();
    });
    m.addEventListener('play', () => Session.state());
    m.addEventListener('pause', () => { update(); Session.state(); });
    // Igroteka и другие оболочки могут менять громкость самого элемента: звук идёт через наш усилитель,
    // поэтому элемент держим на полной громкости, иначе громкость применилась бы дважды
    m.addEventListener('volumechange', () => { if (m.volume !== 1) m.volume = 1; });
    window.addEventListener('pagehide', () => player.rememberPos(true));
    document.addEventListener('visibilitychange', () => { if (document.hidden) player.rememberPos(true); });
  }
  return { track, update, list, eq, toast, applyLook, bind, get seeking() { return seeking; } };
})();

function updateFoot() {
  const L = I18N[settings.ui];
  $('#foot').textContent = `MediaPlayer ${VERSION} · ${L.offline}` + (Store.ok ? '' : ' · ' + L.storageOff);
}

// Горячие клавиши
function onKey(e) {
  const t = e.target;
  const tag = t && t.tagName;
  if (e.ctrlKey || e.metaKey) return;
  if (tag === 'SELECT' || tag === 'TEXTAREA' || (tag === 'INPUT' && t.type !== 'range') || (t && t.isContentEditable)) return;
  // стрелки на ползунке громкости или полосы эквалайзера двигают сам ползунок (не перемотку и не общую громкость)
  if (tag === 'INPUT' && t.id !== 'seek' && /^(Arrow|Page|Home|End)/.test(e.code)) return;
  const row = t && t.classList && t.classList.contains('item') ? t : null;
  if (row && e.altKey && (e.code === 'ArrowUp' || e.code === 'ArrowDown')) {
    e.preventDefault();
    const i = Number(row.dataset.i), j = i + (e.code === 'ArrowUp' ? -1 : 1);
    if (j < 0 || j >= player.list().length) return;
    player.move(i, j);
    const el = $(`#playlist .item[data-i="${j}"]`); if (el) el.focus();
    return;
  }
  if (e.altKey) return;
  if (row && (e.code === 'ArrowUp' || e.code === 'ArrowDown')) {
    e.preventDefault();
    const el = $(`#playlist .item[data-i="${Number(row.dataset.i) + (e.code === 'ArrowUp' ? -1 : 1)}"]`); if (el) el.focus();
    return;
  }
  if (row && e.code === 'Enter') { e.preventDefault(); player.play(Number(row.dataset.i)); return; }
  const s = player.state();
  switch (e.code) {
    case 'Space': e.preventDefault(); if (!e.repeat) player.toggle(); break;
    case 'ArrowRight': e.preventDefault(); player.seek(s.pos + (e.shiftKey ? 30 : 5)); break;
    case 'ArrowLeft': e.preventDefault(); player.seek(s.pos - (e.shiftKey ? 30 : 5)); break;
    case 'ArrowUp': e.preventDefault(); player.setVolume(s.volume + 0.05); break;
    case 'ArrowDown': e.preventDefault(); player.setVolume(s.volume - 0.05); break;
    case 'KeyM': player.setMuted(!s.muted); break;
    case 'KeyN': player.next(); break;
    case 'KeyP': player.prev(); break;
    default:
  }
}
document.addEventListener('keydown', onKey);
// Пробел на кнопке нажал бы её при отпускании: плеер уже ответил на нажатие
document.addEventListener('keyup', (e) => { if (e.code === 'Space' && e.target && (e.target.tagName === 'BUTTON' || e.target.classList.contains('item'))) e.preventDefault(); });

// ---------------------------------------------------------------------------------------
// Запуск
UI.bind();
player.restore();
UI.applyLook();
Session.init();
Session.meta(player.current());
setInterval(() => { player.frame(); if (!UI.seeking) UI.update(); }, 100);
requestAnimationFrame(Viz.loop);

// Для проверок (tests/web/media-player.spec.js) и для оболочки Electron
window.__mp = {
  ready: true, version: VERSION, SONGS: Music.SONGS, EQ_PRESETS, EQ_FREQS, player,
  score: (id) => Music.score(id), cover: (id) => Covers.get(Music.SONGS.find((s) => s.id === id)),
  render: (id, from, len, sr) => Synth.render(id, from, len, sr), analyze, correlate, shuffleOrder,
  level() { const a = Engine.analyser; if (!a) return 0; const d = new Float32Array(a.fftSize); a.getFloatTimeDomainData(d); let s = 0; for (const x of d) s += x * x; return Math.sqrt(s / d.length); },
  gain: () => (Engine.vol ? Engine.vol.gain.value : null),
  voices: () => { const s = player.source(); return s ? s.voices() : 0; },
  eqNodes: () => Engine.filters.map((b) => ({ type: b.type, frequency: b.frequency.value, gain: b.gain.value, Q: b.Q.value })),
  eqResponse(f) { const db = responseDb(Engine.filters, new Float32Array([f]))[0]; return db + 20 * Math.log10(Engine.preamp.gain.value); },
  // Синус freq через ту же цепочку полос в OfflineAudioContext: средняя амплитуда на выходе
  async eqTone(gains, f) {
    const sr = 22050, ctx = new OfflineAudioContext(1, sr, sr);
    const eq = buildEq(ctx, gains);
    const o = ctx.createOscillator(); o.frequency.value = f; o.connect(eq.input); eq.output.connect(ctx.destination); o.start();
    const d = (await ctx.startRendering()).getChannelData(0);
    let s = 0; for (let i = sr / 2; i < sr; i++) s += d[i] * d[i];
    return Math.sqrt(s / (sr / 2)) * Math.SQRT2;
  },
  canvasStats: () => Viz.stats(),
};
</script>
