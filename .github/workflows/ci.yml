# Законы страницы (без программы Electron: её закон гоняют перед выпуском на Windows) в безголовом Chromium на GitHub (ревизия GitHub 25.10, Б5: у веб-репо с тестами не было CI,
# и красный тест FallingBlocks никто не видел). Повторы - только для проверок, завязанных на реальное время
# (под нагрузкой раннера); настоящая поломка красная и с повторами.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Page laws
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "1"
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Dependencies
        run: npm install --no-audit --no-fund

      - name: Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Page laws
        run: npx playwright test tests/media-player.spec.js --workers=1 --retries=2
